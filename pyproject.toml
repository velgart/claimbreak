[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claimbreak"
version = "1.7.103"
description = "Measure segmentation-driven cell-type label error in imaging spatial transcriptomics without ground truth"
readme = "README.md"
authors = [{ name = "Vlad Elgart" }, { name = "Joseph Loscalzo" }]
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "anndata>=0.10", "scikit-learn>=1.3", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest", "pyarrow", "scanpy", "scikit-misc", "harmonypy", "igraph", "pynndescent"]
parquet = ["pyarrow"]
xenium = ["pyarrow", "h5py"]
celltypist = ["celltypist>=1.6"]

[project.scripts]
claimbreak = "claimbreak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimbreak = ["data/*.json"]
